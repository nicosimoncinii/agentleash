# Corpus policy for round-2 cases: default-like.yaml plus the anchored
# "config/secrets.yml" from issue #34, so a bare `config` is a directory
# holding secrets. Keep it a superset of default-like.yaml.
version: 1
secrets:
  files:
    - ".env"
    - ".env.*"
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/id_ecdsa*"
    - "~/.ssh/id_*"
    - "~/.aws/credentials"
    - "~/.config/gcloud/**"
    - "~/.docker/config.json"
    - "~/.netrc"
    - "/proc/*/environ"
    - "config/secrets.yml"
  allow_files:
    - ".env.example"
    - "**/.env.example"
    - ".env.*.example"
    - ".env.sample"
    - ".env.template"
  env:
    - "*_KEY"
    - "*_KEY_*"
    - "*_SECRET*"
    - "*_TOKEN"
    - "*_TOKEN_*"
    - "*PASSWORD*"
    - "*_CREDENTIALS*"
commands:
  deny:
    - "rm -rf /"
    - "rm -rf ~"
    - "rm -rf ~/"
    - "rm -rf $HOME"
    - "git push --force*"
    - "git push -f*"
    - "git push * --force*"
    - "git push * -f"
    - "git push * -f *"
    - ":(){ :|:& };:"
    - "mkfs*"
    - "dd * of=/dev/*"
  ask:
    - "curl * | sh"
    - "curl * | bash"
    - "wget * | sh"
    - "wget * | bash"
    - "git reset --hard*"
